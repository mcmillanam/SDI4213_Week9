name: Security Checks

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # TODO 1: Add a shell step that fails if .env is tracked by Git.
      # Hint: git ls-files --error-unmatch .env
      - name: Verify .env is not tracked by Git
        run: |
          if git ls-files --error-unmatch .env; then
            echo ".env is tracked by Git. Please remove it from version control."
            exit 1
          else
            echo ".env is not tracked by Git."
          fi

      # TODO 2: Build the Docker image, for example:
      # docker build -t helpdesk:security .
      - name: Build hardened Docker image
        run: docker build -t helpdesk:security .
      # TODO 3: Add a step that checks the runtime user ID and fails if it is 0.
      # Hint:
      # USER_ID=$(docker run --rm --entrypoint id helpdesk:security -u)
      # echo "Container UID: $USER_ID"
      # test "$USER_ID" -ne 0
      - name: Verify container runs as non-root user
        run: |
          USER_ID=$(docker run --rm --entrypoint id helpdesk:security -u)
          echo "Container UID: $USER_ID"
          if [ "$USER_ID" -eq 0 ]; then
            echo "Container is running as root. Please switch to a non-root user."
            exit 1
          else
            echo "Container is running as a non-root user."
          fi